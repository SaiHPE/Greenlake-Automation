name: Release (latest from main)

# Every push/merge to main rebuilds the operator app and refreshes a single rolling "latest"
# GitHub Release, so <server>/<owner>/<repo>/releases/latest always has the newest build. Scoped to
# the app + this workflow so doc-only changes elsewhere don't trigger builds; workflow_dispatch lets
# you run it by hand.
#
# RUNNER. This repo lives on GitHub Enterprise Server (github.hpe.com), which has no GitHub-hosted
# runners: the job needs a SELF-HOSTED Windows runner registered on this repo (Settings > Actions >
# Runners) with Node 20, Python 3.12 and the GitHub CLI installed. As of 2026-09-12 Actions is
# disabled by enterprise policy for this user-owned repo (the permissions PUT returns 204 and
# `enabled` stays false; the runner-downloads list is empty), so this workflow is DORMANT and the
# same publish step runs by hand from the dev workstation or the jump box:
#     .\scripts\publish_release.ps1
# The workflow is kept current so it activates untouched the day a runner is available.
on:
  push:
    branches: [main]
    paths:
      - 'Provisioning_Automation/alletra_onboard/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

# Newest push wins; supersede an in-flight build. The release always exists (assets are
# clobbered, not delete+recreated), so a cancelled run can't leave it half-published.
concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  release:
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        shell: pwsh
        working-directory: Provisioning_Automation/alletra_onboard
    env:
      # gh reads GH_TOKEN for github.com and GH_ENTERPRISE_TOKEN for any other host; set both so the
      # publish script works wherever this repo is hosted.
      GH_TOKEN: ${{ github.token }}
      GH_ENTERPRISE_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Provisioning_Automation/alletra_onboard/frontend/package-lock.json

      - name: Ensure GitHub CLI
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            winget install --id GitHub.cli -e --silent --accept-package-agreements --accept-source-agreements
            $env:PATH = "$env:ProgramFiles\GitHub CLI;$env:PATH"
          }
          gh --version

      - name: Build zip and refresh the rolling "latest" release
        run: .\scripts\publish_release.ps1
