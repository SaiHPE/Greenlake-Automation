[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alletra-onboard"
version = "0.19.0"
description = "Local operator automation for HPE Alletra MP B10000 GreenLake and DSCC onboarding."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "tenacity>=8.5.0",
  "structlog>=24.2.0",
  "playwright>=1.45.0",
  "openpyxl>=3.1.0",
  "python-docx>=1.1.0",  # fills the as-built .docx template (Document step) preserving its boilerplate
  # <4 ON PURPOSE (BL-40, LESSONS 43): 4.0 dropped ssh-dss and 5.0 every SHA-1 kex/host key; FOS 7.x
  # switches offer only those. Dependabot flags 3.x for SHA-1 - dismissed as tolerable; do not bump to clear it.
  "paramiko>=3.4.0,<4",
  # Encrypts the secret fields of the state database (ADR 0027). Already installed with paramiko;
  # declared because the app imports it directly.
  "cryptography>=42.0.0",
  # Storage provisioning (Phase 2). 4.2.14 is the floor for the Alletra MP B10000: earlier
  # releases POST to /credentials instead of /api/v1/credentials and fail to authenticate
  # (verified by deep research, Launchpad bug #2128677).
  "python-3parclient>=4.2.14",
  "pyvmomi>=8.0.0",  # read-only ESXi HBA/WWPN discovery via vCenter
  "pywinrm>=0.4.3",  # read-only Windows host discovery over WinRM (SPEC-014 R5)
  "requests>=2.31.0",  # python-3parclient's HTTP transport for WSAPI
  "eventlet>=0.33.0",  # imported (not declared) by python-3parclient's ssh module; dormant for us
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
  "fastapi==0.163.1",     # exact dev pins so scripts/api_types.py emits identical OpenAPI across machines (ADR 0032)
  "pydantic==2.14.3",
  "ruff==0.17.0",
  "import-linter==2.17",  # the dependency rules of docs/STANDARD.md (the `deps` step of scripts/check.py)
  "vulture==2.16",  # dead code, STANDARD M3 (the `vulture` step of scripts/check.py)
]

[project.scripts]
onboard = "alletra_onboard.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/alletra_onboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore:.*Eventlet is deprecated.*",  # transitive via python-3parclient's ssh module; dormant for us
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The gate is the app, its tests and the gate's own two scripts (scripts/check.py, scripts/fitness.py);
# lab, capture and packaging scripts are one-off tools, not linted.
extend-exclude = ["docs", "lab", "scripts/capture_*.py", "scripts/discovery", "scripts/provisioning",
                  "scripts/validation", "build", "ui-smoke", "tools", "cloudinit", "packaging", "playwright captures"]

[tool.ruff.lint]
# ruff is pinned in the dev extra so everyone gets the same rules. The gate is the `lint` and
# `complexity` steps of scripts/check.py: they run ruff and take out today's offenders, which are
# listed per function in quality/ceilings.toml. A bare `ruff check .` prints those too.
extend-select = [
  "C901", "PLR0913", "PLR0912", "PLR0915",  # STANDARD M1: complexity 10, 5 parameters, 12 branches, 50 statements
  "PLC0415",                                # L6: no import inside a function
  "PGH003", "RUF100",                       # T3: no `type: ignore` or `noqa` without its rule code
  "ERA001", "FIX", "TD",                    # C1: no commented-out code, no TODO or FIXME left behind
  "BLE001",                                 # E1: no `except Exception` (per-file-ignores below)
  "S110", "S112",                           # E2: no `except: pass` or `except: continue`
  "SLF001",                                 # S2: no private member access (stops reader._require() in application code)
]
ignore = [
  "PYI034",        # the clients' __enter__ returns the concrete class; WsapiWriter overrides it
  "B023",          # zoning_plan's closures are called inside the loop iteration that defines them
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# STANDARD E1: the only two places a broad catch belongs, the step boundary and the API's error mapping.
"src/alletra_onboard/application/runs/coordinator.py" = ["BLE001"]
"src/alletra_onboard/api/app.py" = ["BLE001"]
# STANDARD L6/S2: tests may use local imports and inspect client internals under test.
"tests/**" = ["PLC0415", "SLF001"]

# The dependency rules of docs/STANDARD.md (3.1 to 3.3), checked by `lint-imports` (the `deps` step
# of scripts/check.py). An `ignore_imports` entry is a violation that exists today: fix it and
# delete its line (a line whose import is gone fails the check). Never add one.
# Here an import under `if TYPE_CHECKING:` counts like any other. The two contracts where a
# type-only import is allowed (L3, L6) are in quality/imports-type-only.toml.
[tool.importlinter]
root_package = "alletra_onboard"
include_external_packages = true
exclude_type_checking_imports = false

# S2 least privilege: each writer adapter is imported only by its single writer-factory module,
# and each writer-factory module is imported only by the apply modules that need that transport.
[[tool.importlinter.contracts]]
id = "S2-wsapi-writer"
name = "S2 least privilege: the WSAPI writer is imported only by the shared WSAPI writer factory"
type = "protected"
protected_modules = ["alletra_onboard.adapters.array.wsapi_writer"]
allowed_importers = ["alletra_onboard.application.runs.writer_clients"]
unmatched_ignore_imports_alerting = "error"
broken_contract_guidance = "STANDARD S2 (least privilege): only application.runs.writer_clients may import wsapi_writer. Use WsapiReader (make_wsapi) for reads, or take a writer from writer_clients inside an approved apply."

[[tool.importlinter.contracts]]
id = "S2-rc-writer"
name = "S2 least privilege: the Remote Copy SSH writer is imported only by the factory that builds it"
type = "protected"
protected_modules = ["alletra_onboard.adapters.array.rc_cli_client"]
allowed_importers = ["alletra_onboard.application.replication.clients"]
unmatched_ignore_imports_alerting = "error"
broken_contract_guidance = "STANDARD S2 (least privilege): only application.replication.clients may import rc_cli_client. Put shared error or plan types in domain."

[[tool.importlinter.contracts]]
id = "S2-snap-writer"
name = "S2 least privilege: the snapshot-schedule SSH writer is imported only by the factory that builds it"
type = "protected"
protected_modules = ["alletra_onboard.adapters.array.snap_cli_client"]
allowed_importers = ["alletra_onboard.application.snapshots.clients"]
unmatched_ignore_imports_alerting = "error"
broken_contract_guidance = "STANDARD S2 (least privilege): only application.snapshots.clients may import snap_cli_client. Put shared error or plan types in domain."

[[tool.importlinter.contracts]]
id = "S2-wsapi-factory"
name = "S2 least privilege: the WSAPI writer factory is imported only by the four apply modules"
type = "protected"
protected_modules = ["alletra_onboard.application.runs.writer_clients"]
allowed_importers = [
  "alletra_onboard.application.provisioning.apply",
  "alletra_onboard.application.replication.apply",
  "alletra_onboard.application.replication.failover",
  "alletra_onboard.application.snapshots.apply",
]
unmatched_ignore_imports_alerting = "error"
broken_contract_guidance = "STANDARD S2 (least privilege): only the four apply modules may import the WSAPI writer factory. Read-only steps and planners use make_wsapi (WsapiReader)."

[[tool.importlinter.contracts]]
id = "S2-rc-factory"
name = "S2 least privilege: the Remote Copy SSH writer factory is imported only by partnership_apply"
type = "protected"
protected_modules = ["alletra_onboard.application.replication.clients"]
allowed_importers = ["alletra_onboard.application.replication.partnership_apply"]
unmatched_ignore_imports_alerting = "error"
broken_contract_guidance = "STANDARD S2 (least privilege): only application.replication.partnership_apply may import the Remote Copy SSH writer factory."

[[tool.importlinter.contracts]]
id = "S2-snap-factory"
name = "S2 least privilege: the snapshot SSH writer factory is imported only by snapshots.apply"
type = "protected"
protected_modules = ["alletra_onboard.application.snapshots.clients"]
allowed_importers = ["alletra_onboard.application.snapshots.apply"]
unmatched_ignore_imports_alerting = "error"
broken_contract_guidance = "STANDARD S2 (least privilege): only application.snapshots.apply may import the snapshot SSH writer factory."

[[tool.importlinter.contracts]]
id = "S2-wsapi-client"
name = "S2 least privilege: the WSAPI reader is imported only by its factory and WsapiWriter"
type = "protected"
protected_modules = ["alletra_onboard.adapters.array.wsapi_client"]
allowed_importers = [
  "alletra_onboard.application.provisioning.clients",
  "alletra_onboard.adapters.array.wsapi_writer",
]
unmatched_ignore_imports_alerting = "error"
broken_contract_guidance = "STANDARD S2 (least privilege): take a WSAPI reader from application.provisioning.clients (make_wsapi); put shared error or plan types in domain."

# L1 and L2 in one contract, so a violation is listed once. `config` sits where it is used today:
# application and the entrypoints read it, adapters and domain do not.
[[tool.importlinter.contracts]]
id = "L1-L2-layers"
name = "L1, L2 layers: entrypoints, application, adapters, domain; imports only point inward"
type = "layers"
containers = ["alletra_onboard"]
exhaustive = true
layers = ["__main__", "api | cli", "application", "config", "adapters", "domain"]
unmatched_ignore_imports_alerting = "error"
broken_contract_guidance = "STANDARD L1, L2 (layers): domain imports nothing outside domain; adapters never import application or api. Move what both sides need down (shared adapter plumbing lives in adapters/, shared types in domain/). Do not add an ignore_imports line."

# External packages are known by their top name only, so `urllib` (urllib.parse is not I/O,
# urllib.request is) cannot be listed.
[[tool.importlinter.contracts]]
id = "L4-no-io-libraries"
name = "L4 application and domain import no network, SSH, browser or process library"
type = "forbidden"
source_modules = ["alletra_onboard.application", "alletra_onboard.domain", "alletra_onboard.config"]
forbidden_modules = [
  "httpx", "requests", "urllib3", "aiohttp", "websockets", "http", "ftplib", "smtplib", "telnetlib",
  "paramiko", "socket", "ssl", "subprocess", "playwright",
  "pyVmomi", "pyVim", "winrm", "requests_ntlm", "spnego", "hpe3parclient", "eventlet",
]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "error"
broken_contract_guidance = "STANDARD L4: network, SSH, browser and process I/O lives in an adapter. Put the call in an adapter and hand its result (or a domain error) to the application code. Do not add an ignore_imports line."

# The one ignore_imports line is the rule's own allowance (the store the entrypoint opens), not a
# violation.
[[tool.importlinter.contracts]]
id = "L5-entrypoints"
name = "L5 entrypoints never import an adapter except the store they open"
type = "forbidden"
source_modules = ["alletra_onboard.api", "alletra_onboard.cli", "alletra_onboard.__main__"]
forbidden_modules = ["alletra_onboard.adapters"]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "error"
ignore_imports = [
  "alletra_onboard.api.app -> alletra_onboard.adapters.persistence.sqlite",
]
broken_contract_guidance = "STANDARD L5 (composition root): api/app.py and the CLI reach devices through application services, wired in create_app and application/service.py. Add the call to a service. Do not add an ignore_imports line."

# `service` is the composition root (L5), so nothing in application imports it: it is the top layer.
# The step contexts may import each other (`:`), except each other's plan and apply (the two
# contracts after this one).
[[tool.importlinter.contracts]]
id = "B1-workflow-order"
name = "B1 workflow packages: documents, the step contexts, runs, platform; imports only go down"
type = "layers"
containers = ["alletra_onboard.application"]
exhaustive = true
layers = [
  "service",
  "documents",
  "onboarding : provisioning : snapshots : replication : unified_file",
  "runs",
  "platform",
]
unmatched_ignore_imports_alerting = "error"
broken_contract_guidance = "STANDARD B1 (workflow order): documents -> step contexts -> runs -> platform, imports only go down. Move a shared read down, to an adapter or domain. Do not add an ignore_imports line."

[[tool.importlinter.contracts]]
id = "B1-replication-plan-apply"
name = "B1 step contexts do not import replication's plan or apply"
type = "forbidden"
source_modules = [
  "alletra_onboard.application.onboarding",
  "alletra_onboard.application.provisioning",
  "alletra_onboard.application.snapshots",
  "alletra_onboard.application.unified_file",
]
forbidden_modules = [
  "alletra_onboard.application.replication.plan",
  "alletra_onboard.application.replication.plan_check",
  "alletra_onboard.application.replication.apply",
]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "error"
broken_contract_guidance = "STANDARD B1: a step context does not import another context's plan or apply. Move what both need down, to an adapter or domain. Do not add an ignore_imports line."

[[tool.importlinter.contracts]]
id = "B1-snapshots-plan-apply"
name = "B1 step contexts do not import snapshots' plan or apply"
type = "forbidden"
source_modules = [
  "alletra_onboard.application.onboarding",
  "alletra_onboard.application.provisioning",
  "alletra_onboard.application.replication",
  "alletra_onboard.application.unified_file",
]
forbidden_modules = [
  "alletra_onboard.application.snapshots.plan",
  "alletra_onboard.application.snapshots.apply",
]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "error"
broken_contract_guidance = "STANDARD B1: a step context does not import another context's plan or apply. Move what both need down, to an adapter or domain. Do not add an ignore_imports line."

